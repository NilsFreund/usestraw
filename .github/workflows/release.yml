name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Publishes the package CI just tested, through npm trusted publishing, which adds provenance
  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Tag, package.json and CHANGELOG.md agree
        run: |
          version=$(node -p 'require("./package.json").version')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME, package.json $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          grep -qF "## [$version] - " CHANGELOG.md || { echo "::error::CHANGELOG.md has no $version section"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      # Until the first stable version, release candidates are what `npm install usestraw` gets
      - name: Publish, unless this version is on npm already
        run: |
          if npm view "usestraw@$VERSION" version > /dev/null 2>&1; then
            echo "usestraw@$VERSION is on npm already"
            exit 0
          fi
          latest=$(npm view usestraw dist-tags.latest 2> /dev/null || true)
          case "$VERSION" in
            *-*) case "$latest" in "" | *-*) tag=latest ;; *) tag=next ;; esac ;;
            *) tag=latest ;;
          esac
          npm publish "./usestraw-$VERSION.tgz" --tag "$tag"

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '/^## \[/ { p = index($0, "[" v "]") > 0; next } /^\[.*\]: / { next } p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          case "$version" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" $pre
