name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx biome ci
      - run: bun run typecheck
      - run: bun run coverage
      - run: bun run build
      - name: Size, min+gzip
        run: |
          for budget in index:50000 core:35000; do
            entry=${budget%%:*} max=${budget##*:}
            bun build "dist/$entry.js" --minify --target=node --outfile="$RUNNER_TEMP/$entry.js" > /dev/null
            size=$(gzip -9c "$RUNNER_TEMP/$entry.js" | wc -c)
            echo "$entry: $size B of $max B"
            [ "$size" -le "$max" ] || { echo "::error::$entry is $size B, over its $max B budget"; exit 1; }
          done
      - run: npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: usestraw-*.tgz
          if-no-files-found: error

  # The tests on every supported Node line, then the packed package as users install it
  test:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx vitest run
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Smoke test on Node
        working-directory: ${{ runner.temp }}
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund ./package/usestraw-*.tgz
          cp "$GITHUB_WORKSPACE/.github/smoke.mjs" .
          node smoke.mjs
      - name: Smoke test on Bun
        if: matrix.node == '24'
        working-directory: ${{ runner.temp }}
        run: bun smoke.mjs
